name: CI

on:
  push:
    paths:
      - "Casks/*.rb"
  pull_request:
    paths:
      - "Casks/*.rb"
  workflow_dispatch:

jobs:
  audit:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Run tests
        run: make test
