name: CI

on:
  push:
    paths:
      - "Casks/*.rb"
  pull_request:
    paths:
      - "Casks/*.rb"
  workflow_dispatch:

jobs:
  audit:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Register tap against workspace
        run: brew tap jchonig/casks "$GITHUB_WORKSPACE"

      - name: Run tests
        run: make test
