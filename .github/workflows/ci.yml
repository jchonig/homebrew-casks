name: CI

on:
  push:
    paths:
      - "Casks/*.rb"
  pull_request:
    paths:
      - "Casks/*.rb"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Run tests
        run: make test
