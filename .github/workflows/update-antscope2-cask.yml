name: Update AntScope2 Cask

on:
  schedule:
    - cron: "0 7 * * *"   # daily at 07:00 UTC
  workflow_dispatch:

jobs:
  update-cask:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find latest version and URL
        id: versions
        run: |
          python3 << 'EOF'
          import urllib.request, urllib.parse, re, os, sys

          BASE = "https://rigexpert.com/files/software/Antscope/antscope2formacos/"

          def fetch(url):
              with urllib.request.urlopen(url) as r:
                  return r.read().decode("utf-8")

          def find_dmg(html):
              dmgs = re.findall(r'href="(AntScope2[^"]+\.dmg)"', html)
              return dmgs[0] if dmgs else None

          def version_key(href):
              name = urllib.parse.unquote(href)
              m = re.search(r"(\d+(?:\.\d+)+)", name)
              return [int(x) for x in m.group(1).split(".")] if m else [0]

          html = fetch(BASE)
          hrefs = re.findall(r'href="([^"]+/)"', html)

          latest_dirs = sorted(
              [h for h in hrefs if urllib.parse.unquote(h).startswith("From")],
              key=version_key,
          )

          if not latest_dirs:
              print("ERROR: could not find any 'From MacOS' directories", file=sys.stderr)
              sys.exit(1)

          latest_dir = latest_dirs[-1]
          dmg = find_dmg(fetch(BASE + latest_dir))

          if not dmg:
              print("ERROR: could not find DMG file", file=sys.stderr)
              sys.exit(1)

          m = re.search(r"AntScope2_([0-9.]+)_mac\.dmg", dmg)
          version = m.group(1) if m else ""

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
              f.write(f"url={BASE}{latest_dir}{dmg}\n")
          EOF

      - name: Download DMG and compute checksum
        id: sha
        run: |
          curl -fsSL "${{ steps.versions.outputs.url }}" -o antscope2.dmg
          echo "sha256=$(shasum -a 256 antscope2.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update cask file
        run: |
          export VERSION="${{ steps.versions.outputs.version }}"
          export SHA256="${{ steps.sha.outputs.sha256 }}"
          export URL="${{ steps.versions.outputs.url }}"
          envsubst < "Casks/antscope2.rb.in" > "Casks/antscope2.rb"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add Casks/antscope2.rb
          git commit -m "Update AntScope2 cask to v${{ steps.versions.outputs.version }}"
          git push
