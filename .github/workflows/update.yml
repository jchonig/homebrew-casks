name: Update Casks

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Update casks
        run: make update
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add Casks/*.rb Formula/*.rb

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          MSG=$(git diff --cached --name-only | while IFS= read -r f; do
            name=$(basename "$f" .rb)
            case "$f" in
              Casks/*) kind="cask" ;;
              Formula/*) kind="formula" ;;
              *) kind="package" ;;
            esac
            ver=$(grep -m1 'version "' "$f" | sed 's/.*version "\([^"]*\)"/\1/')
            if [ -z "$ver" ]; then
              # Formula files have no top-level `version` field; pull it from
              # the first release URL instead (e.g. .../download/v1.2.3/...).
              ver=$(grep -o '/v[0-9][^/"]*/' "$f" | head -1 | tr -d '/v')
            fi
            printf 'Update %s %s to v%s\n' "$name" "$kind" "$ver"
          done | paste -sd'; ' -)

          git commit -m "$MSG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  keepalive:
    if: github.event_name == 'schedule'
    uses: jchonig/workflows/.github/workflows/keepalive.yml@main
    permissions:
      actions: write
