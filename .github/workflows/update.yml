name: Update Casks

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update casks
        run: make update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add Casks/antscope2.rb Casks/hamclocklauncher.rb Formula/fetchbox.rb

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          MSG=$(git diff --cached --name-only | while IFS= read -r f; do
            name=$(basename "$f" .rb)
            ver=$(grep -m1 'version "' "$f" | sed 's/.*version "\([^"]*\)"/\1/')
            printf 'Update %s cask to v%s\n' "$name" "$ver"
          done | paste -sd'; ' -)

          git commit -m "$MSG"
          git push

  keepalive:
    if: github.event_name == 'schedule'
    uses: jchonig/workflows/.github/workflows/keepalive.yml@main
    permissions:
      actions: write
